<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bé vui học Toán - Cô Như Quỳnh</title><style>:root{font-family:system-ui,'Arial',sans-serif;color:#25415c}*{box-sizing:border-box}body{margin:0;background:linear-gradient(140deg,#e6f9f3,#fff0f5,#fff8dc);min-height:100vh}.wrap{max-width:850px;margin:auto;padding:18px}.panel{background:white;border-radius:26px;box-shadow:0 10px 30px #6d9baf22;padding:24px;margin:16px 0}h1{text-align:center;color:#e56b91;font-size:clamp(26px,5vw,39px)}h2{color:#227f87}p{line-height:1.55}input{padding:14px;border:2px solid #a6d9ce;border-radius:14px;font-size:20px;max-width:100%;width:310px}button{border:0;border-radius:16px;padding:15px 22px;font-weight:750;font-size:20px;cursor:pointer;background:#7bd4c1;color:#153e49;margin:6px;box-shadow:0 4px 0 #4ba796}button:active{transform:translateY(3px);box-shadow:none}button:disabled{opacity:.45;cursor:not-allowed}.choice{background:#fff0b3;min-width:80px}.hidden{display:none}.center{text-align:center}.question{font-size:clamp(30px,7vw,53px);font-weight:800;text-align:center;margin:20px}.feedback{font-size:21px;font-weight:700;min-height:35px;text-align:center}.progress{background:#e9f4f2;border-radius:12px;overflow:hidden;height:13px}.bar{background:#f6a4c1;height:100%;transition:width .3s}.top{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}.tag{background:#e5f8f2;padding:9px 13px;border-radius:20px;font-weight:700}.tiles{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.tile{border-radius:9px;text-align:center;padding:10px 0;font-size:clamp(15px,4vw,27px);font-weight:800;background:#fff0b3}.tile.answer{background:#d8f4fa}.tile.active{outline:3px solid #ed8aa8}.fish{font-size:clamp(32px,6vw,53px);letter-spacing:5px}.aquariums{display:flex;gap:14px;justify-content:center}.bowl{width:45%;min-height:145px;border:5px solid #91cbe2;border-top:8px solid #6eb4d2;border-radius:45% 45% 38% 38%;background:linear-gradient(#e6faff,#b8e9ff);display:flex;justify-content:center;align-items:center;flex-wrap:wrap;padding:10px}.boats{font-size:clamp(28px,5vw,45px);line-height:1.6}.rabbits{display:grid;grid-template-columns:repeat(auto-fit,minmax(125px,1fr));gap:12px}.rabbit{border:2px solid #d7e8dd;background:#fffaf0;border-radius:17px;padding:10px;text-align:center}.rabbit .emoji{font-size:48px}.houses{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.house{background:#ffe7b7}.done{background:#d2f4e2!important}.small{font-size:15px;color:#58717a}.celebrate{font-size:70px;text-align:center}@media(max-width:500px){.panel{padding:15px}.wrap{padding:9px}button{padding:13px 14px;font-size:18px}.bowl{min-height:115px}.houses{grid-template-columns:repeat(3,1fr)}} </style></head><body><main class="wrap"><h1>🌈 Bé vui học Toán 🌈</h1><div class="center">Lớp 1A4 • Học vui cùng cô Như Quỳnh</div><section class="panel" id="intro"><h2>👋 Chào con!</h2><p>Con nhập tên để cùng cô vượt qua 4 chặng thử thách nhé!</p><div class="center"><input id="student" maxlength="45" placeholder="Tên của con"><br><button onclick="start()">🚀 Bắt đầu chơi</button></div></section><section class="panel hidden" id="game"><div class="top"><span class="tag" id="who"></span><span class="tag" id="score"></span></div><h2 id="stage"></h2><div class="progress"><div class="bar" id="bar"></div></div><p class="center" id="instructions"></p><div id="content"></div><div class="feedback" id="feedback" aria-live="polite"></div><div class="center"><button id="next" class="hidden" onclick="advance()">Tiếp tục ➜</button></div></section><section class="panel hidden center" id="finish"><div class="celebrate">🏆🎉🌟</div><h2 id="congrats"></h2><p id="summary"></p><button onclick="restart()">🔁 Chơi lại</button></section></main><script>const $=id=>document.getElementById(id);let name='',stage=0,idx=0,points=0,locked=false,wrong=0;const sums=[[0,4],[2,3],[3,3],[3,1],[0,5],[4,2],[2,2],[1,4],[6,0]];const pairs=[[6,1],[5,2],[4,3],[3,4],[2,5],[1,6],[0,7]];const rabbits=[[3,1],[6,2],[5,2],[2,4],[3,2],[6,3]];const titles=['⚡ Chặng 1: Tia chớp tính nhẩm','🔢 Chặng 2: Giải mã ô số','🐠 Chặng 3: Thủy cung và bến thuyền','🐰 Chặng 4: Giúp thỏ tìm chuồng'];const praise=['Cô Như Quỳnh khen con tính nhẩm thật nhanh! 🌟','Con đã khám phá các cặp số tạo thành 7. Tuyệt vời! 🎈','Cô Như Quỳnh rất vui vì con đếm chính xác! 🐟','Con thật giỏi! Các bạn thỏ đã về đúng chuồng! 🐰'];function start(){name=$('student').value.trim();if(!name){alert('Con hãy nhập tên trước nhé!');return} $('intro').classList.add('hidden');$('game').classList.remove('hidden');stage=0;idx=0;points=0;render()}function restart(){$('finish').classList.add('hidden');$('intro').classList.remove('hidden');$('student').value=name}function count(){return [9,7,2,6][stage]}function render(){locked=false;wrong=0;$('next').classList.add('hidden');$('feedback').textContent='';$('who').textContent='👧 '+name;$('score').textContent='⭐ '+points+' điểm';$('stage').textContent=titles[stage];$('bar').style.width=((idx/count())*100)+'%';let html='';if(stage===0){let [a,b]=sums[idx];$('instructions').textContent=`Câu ${idx+1}/9: Con chọn kết quả đúng nhé!`;html=`<div class="question">${a} + ${b} = ?</div><div class="center">${options(a+b,0,9)}</div>`}if(stage===1){let [a,b]=pairs[idx];$('instructions').textContent=`Ô ${idx+1}/7: Con tìm tổng của hai số nhé!`;html=`<div class="tiles"><div class="tile">+</div>${pairs.map(x=>`<div class="tile">${x[0]}</div>`).join('')}<div class="tile">+</div>${pairs.map(x=>`<div class="tile">${x[1]}</div>`).join('')}<div class="tile answer">=</div>${pairs.map((x,i)=>`<div class="tile answer ${i===idx?'active':''}">${i<idx?'7':'?'}</div>`).join('')}</div><div class="question">${a} + ${b} = ?</div><div class="center">${options(7,4,9)}</div>`}if(stage===2){$('instructions').textContent=idx===0?'Con đếm số cá trong hai bể rồi chọn kết quả đúng.':'Con đếm hai nhóm thuyền rồi chọn kết quả đúng.';html=idx===0?`<div class="aquariums"><div class="bowl fish">🐠🐟🐡🐟🐠</div><div class="bowl"></div></div><div class="question">5 + 0 = ?</div><div class="center">${options(5,3,7)}</div>`:`<div class="center boats">⛵⛵⛵<br>⛵⛵⛵⛵</div><div class="question">3 + 4 = ?</div><div class="center">${options(7,5,9)}</div>`}if(stage===3){let [a,b]=rabbits[idx];$('instructions').textContent=`Bạn thỏ ${idx+1}/6: Con chọn ngôi nhà có số đúng!`;html=`<div class="rabbit"><div class="emoji">🐰</div><div class="question" style="margin:5px">${a} + ${b}</div></div><div class="houses">${[4,5,6,7,8,9].map(n=>`<button class="house" onclick="check(${n},${a+b})">🏠<br>${n}</button>`).join('')}</div>`}$('content').innerHTML=html}function options(correct,min,max){let choices=[correct];for(let delta of [-1,1,-2,2,-3,3]){let n=correct+delta;if(n>=min&&n<=max&&!choices.includes(n))choices.push(n);if(choices.length===3)break}choices.sort((a,b)=>a-b);return choices.map(n=>`<button class="choice" onclick="check(${n},${correct})">${n}</button>`).join('')}function check(n,correct){if(locked)return;if(n!==correct){wrong++;$('feedback').style.color='#c85a63';$('feedback').textContent='Con thử lại nhé! Cô tin con làm được. 💗';return}locked=true;points+=wrong===0?10:5;$('score').textContent='⭐ '+points+' điểm';$('feedback').style.color='#178a69';$('feedback').textContent='Chính xác! Cô Như Quỳnh khen con! 🌟';document.querySelectorAll('#content button').forEach(b=>b.disabled=true);$('bar').style.width=((idx+1)/count()*100)+'%';$('next').textContent=idx===count()-1?'Hoàn thành chặng 🎉':'Câu tiếp theo ➜';$('next').classList.remove('hidden')}function advance(){if(!locked)return;idx++;if(idx<count()){render();return}alert(praise[stage]);stage++;idx=0;if(stage===4){$('game').classList.add('hidden');$('finish').classList.remove('hidden');$('congrats').textContent='Cô Như Quỳnh chúc mừng '+name+'!';$('summary').textContent=`Con đã hoàn thành cả 4 chặng và nhận được ${points}/240 điểm. Cô rất tự hào về sự cố gắng của con! 💖`;return}render()}</script></body></html>
